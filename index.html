<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Warehouse ERP</title>

<link rel="stylesheet" href="style.css">

</head>


<body>


<div id="loginPage" class="login-box">

<h1>🏭 Warehouse ERP</h1>

<input id="username" placeholder="اسم المستخدم">

<input id="password" type="password" placeholder="كلمة المرور">

<button onclick="login()">دخول</button>

<p id="loginMsg"></p>

</div>




<div id="system" style="display:none">


<div class="sidebar">

<h2>🏭 المخازن</h2>

<button onclick="showPage('dashboard')">
🏠 الرئيسية
</button>

<button onclick="showPage('items')">
📦 الأصناف
</button>

<button onclick="showPage('containers')">
🚢 الكونتينرات
</button>

<button onclick="showPage('inventory')">
📊 المخزون
</button>

<button onclick="showPage('requests')">
📋 طلبات الاحتياج
</button>

<button onclick="logout()">
🚪 خروج
</button>

</div>





<div class="content">


<header>

<h2 id="pageTitle">
Dashboard
</h2>

<span id="currentUser"></span>

</header>



<section id="dashboard">


<div class="cards">


<div class="card">
<h3>📦 الأصناف</h3>
<strong id="itemsCount">0</strong>
</div>


<div class="card">
<h3>🚢 الكونتينرات</h3>
<strong id="containersCount">0</strong>
</div>


<div class="card">
<h3>📋 الطلبات</h3>
<strong id="requestsCount">0</strong>
</div>


<div class="card">
<h3>🔄 الحركات</h3>
<strong id="transactionsCount">0</strong>
</div>


</div>


</section>





<section id="items" class="hidden">


<h2>📦 الأصناف</h2>


<input id="search"
placeholder="بحث عن صنف"
onkeyup="searchItems()">



<table>

<thead>

<tr>
<th>الكود</th>
<th>الصنف</th>
<th>الوحدة</th>
<th>الموقع</th>
<th>Barcode</th>
</tr>

</thead>


<tbody id="itemsTable"></tbody>


</table>


</section>






<section id="containers" class="hidden">


<h2>🚢 الكونتينرات</h2>


<table>

<thead>

<tr>
<th>الكود</th>
<th>الاسم</th>
<th>المشروع</th>
<th>الموقع</th>
</tr>

</thead>


<tbody id="containersTable"></tbody>


</table>


</section>




<section id="inventory" class="hidden">

<h2>📊 المخزون</h2>

<div id="inventoryData"></div>

</section>



<section id="requests" class="hidden">

<h2>📋 طلبات الاحتياج</h2>

<div>
لا يوجد طلبات حالياً
</div>

</section>



</div>

</div>



<script src="app.js"></script>

</body>

</html>
